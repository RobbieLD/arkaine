name: Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Android.Arkaine/**'
      - '.github/workflows/android.yaml'
  push:
    branches: [main]
    paths:
      - 'Android.Arkaine/**'
      - '.github/workflows/android.yaml'
    tags:
      - 'android-v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Android.Arkaine
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/android-v') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Decode keystore
        if: env.IS_RELEASE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build debug APK
        if: env.IS_RELEASE != 'true'
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        if: env.IS_RELEASE == 'true'
        env:
          VERSION_NAME: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: arkaine-apk
          path: Android.Arkaine/app/build/outputs/apk/**/*.apk

      - name: Attach APK to GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: Android.Arkaine/app/build/outputs/apk/release/*.apk
